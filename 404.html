<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Challenge Not Found</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .error-container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .terminal-card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* Terminal-style top bar decor */
        .terminal-card::before {
            content: "•••";
            position: absolute;
            top: 12px;
            left: 15px;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #475569;
            line-height: 0;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: var(--error);
            line-height: 1;
            margin-bottom: 1rem;
            font-family: monospace;
        }

        .error-title {
            font-size: 1.75rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .error-desc {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 1rem;
        }

        .terminal-output {
            background-color: #090d16;
            border-radius: 6px;
            padding: 1rem;
            text-align: left;
            font-family: monospace;
            font-size: 0.85rem;
            color: #34d399; /* Terminal green */
            border: 1px solid #1e293b;
            margin-bottom: 0.5rem;
        }

        .terminal-output span {
            color: var(--error);
        }

        .btn-home {
            display: inline-block;
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            background-color: var(--accent);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="terminal-card">
            <div class="error-code">404</div>
            <h1 class="error-title">Deployment Failed: Route Not Found</h1>
            
            <p class="error-desc">The challenge markdown file you are looking for does not exist in the repository or has been moved to a different directory.</p>
            
            <div class="terminal-output">
                $ git checkout challenge-file<br>
                <span>error: pathspec 'challenge-file' did not match any file(s) known to git.</span><br>
                $ ▮
            </div>
        </div>

        <a href="index.html" class="btn-home">← Back to Dashboard</a>
    </div>

</body>
</html>
