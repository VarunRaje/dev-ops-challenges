events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Add custom MIME type for markdown files to display cleanly as text
    types {
        text/markdown  md;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Serve standard static files
        location / {
            try_files $uri $uri/ =404;
        }

        # Handling for challenge URLs
        location /challenges/ {
            # 1. Check if the exact file exists (e.g. assets, images, viewer.html, or direct .md fetch)
            # 2. Otherwise, rewrite extensionless challenge paths to the dynamic viewer
            try_files $uri @challenge_rewrite;
        }

        location @challenge_rewrite {
            rewrite ^/challenges/([^/.]+)$ /challenges/viewer.html last;
        }
    }
}
