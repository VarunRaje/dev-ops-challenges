events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    types {
        text/markdown  md;
    }

    server_tokens off;
    # Relative Location headers, so redirects keep the https scheme set by the TLS proxy in front
    absolute_redirect off;
    charset utf-8;
    charset_types text/html text/css text/plain text/markdown application/javascript application/json application/xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/plain text/markdown application/javascript application/json application/xml image/svg+xml;

    # Screenshots and assets change rarely; HTML stays short-lived so content updates show quickly.
    map $uri $cache_control {
        ~*\.(webp|png|jpg|jpeg|svg|ico)$  "public, max-age=2592000";
        ~*\.css$                          "public, max-age=86400";
        default                           "public, max-age=300";
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;

        add_header Cache-Control $cache_control always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # Homepage. try_files serves the file directly, so it never hits the /index.html redirect below.
        location = / {
            try_files /index.html =404;
        }

        # One canonical homepage URL
        location = /index.html {
            return 301 /;
        }

        # Search Console verification file must stay reachable as .html
        location ~ ^/google[0-9a-f]+\.html$ {
        }

        # Clean URLs only: /challenges/x.html -> /challenges/x
        location ~ ^/(.+)\.html$ {
            return 301 /$1;
        }

        # /contact -> contact.html, /challenges/<slug> -> challenges/<slug>.html; anything else is a real 404
        location / {
            try_files $uri $uri.html =404;
        }
    }
}
